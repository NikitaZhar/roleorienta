name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    # Версия Ubuntu закреплена (2026-11-11, §307): ubuntu-latest с 19.10.2026 переходит на Ubuntu 26, а
    # «playwright install-deps» версии 1.49 ставит библиотеки Chromium только для известных ему версий Ubuntu (до 24.04) —
    # шаг падал, сборка не запускалась. Поднять — вместе с версией Playwright (job-worker/pom.xml).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Системные библиотеки Chromium для браузера без окна (Playwright, §236; ChromiumPageRendererTests); сам Chromium
      # Playwright скачивает при первом запуске теста.
      - name: Install Chromium system dependencies
        run: npx --yes playwright@1.49.0 install-deps chromium

      # verify: Checkstyle, компиляция и тесты (Testcontainers использует Docker раннера); модуль web —
      # сборка SPA: Node.js скачивает frontend-maven-plugin.
      - name: Build and test
        run: mvn -B -ntp verify
