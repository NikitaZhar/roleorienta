name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify: Checkstyle, компиляция и тесты (Testcontainers использует Docker раннера); модуль web —
      # сборка SPA: Node.js скачивает frontend-maven-plugin.
      - name: Build and test
        run: mvn -B -ntp verify
