spring:
  application:
    name: job-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roleorienta}
    username: ${DB_USERNAME:roleorienta}
    password: ${DB_PASSWORD:roleorienta}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# job-api владеет схемой БД и применяет миграции Flyway (ADR-2).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
