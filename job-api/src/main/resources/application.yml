spring:
  application:
    name: job-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/roleorienta}
    username: ${DB_USERNAME:roleorienta}
    password: ${DB_PASSWORD:roleorienta}
  jpa:
    hibernate:
      ddl-auto: validate   # схему создаёт только Flyway; Hibernate лишь сверяет сущности с ней
    open-in-view: false    # соединение с БД не держится на всё время HTTP-запроса
  flyway:
    enabled: true          # job-api — единственный владелец схемы (технический документ §16.1)
    locations: classpath:db/migration
  session:
    timeout: 30m           # сессия без запросов дольше — вход заново
    jdbc:
      initialize-schema: never  # таблицы сессий создаёт миграция V19, не приложение

app:
  countries: SK            # поддерживаемые страны поиска (ISO 3166-1 alpha-2): есть сбор компаний
  default-portion-limit: 20  # лимит порции, если пользователь его не задал (технический документ §17)

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true    # cookie сессии недоступна JavaScript
        same-site: lax     # браузер не шлёт cookie с запросами чужих сайтов
        secure: ${SESSION_COOKIE_SECURE:false}  # true при развёртывании за HTTPS; локально http

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/liveness и /readiness для Docker и Kubernetes
