# Инфраструктура для локальной разработки (профиль local, технический документ §12):
# PostgreSQL, RabbitMQ и S3-совместимое хранилище снимков (SeaweedFS).
# Приложения job-api и job-worker пока запускаются из Maven (см. README).
# Значения ниже — локальные значения по умолчанию, не секреты; переопределяются файлом .env.

name: roleorienta

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-roleorienta}
      POSTGRES_USER: ${DB_USERNAME:-roleorienta}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-roleorienta}
    ports:
      - "5433:5432"   # на хосте 5433, чтобы не конфликтовать с локальной PostgreSQL
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-roleorienta} -d ${DB_NAME:-roleorienta}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-roleorienta}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-roleorienta}
    ports:
      - "5672:5672"
      - "15672:15672"  # веб-консоль http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Хранилище снимков — SeaweedFS (Apache-2.0; замена архивного образа MinIO, технический документ §15).
  # Образ сам запускает «weed mini» — все части SeaweedFS (учёт, данные, имена файлов, S3-шлюз) одним
  # процессом, данные в /data. Доступ к S3 — AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (без них — доступ
  # всем). Тег закреплён; тот же образ — в тестах (job-worker TestcontainersConfiguration).
  # https://github.com/seaweedfs/seaweedfs/wiki/Quick-Start-with-weed-mini
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-roleorienta}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-roleorienta-secret}
    ports:
      - "8333:8333"   # S3-шлюз
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Резервная копия PostgreSQL (стенограмма §141): при старте и раз в сутки pg_dump в ./backups, последние 14 копий;
  # восстановление и его проверка — ops/restore.sh. Снимки SeaweedFS не копируются (срок хранения 30 дней,
  # потеря снимков не теряет данных: вакансии и история — в PostgreSQL); RabbitMQ — тоже (задания — в PostgreSQL).
  backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-roleorienta}
      PGUSER: ${DB_USERNAME:-roleorienta}
      PGPASSWORD: ${DB_PASSWORD:-roleorienta}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}   # секунд между копиями
      BACKUP_KEEP: ${BACKUP_KEEP:-14}              # сколько последних копий хранить
    volumes:
      - ./backups:/backups
      - ./ops/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  seaweedfs-data:
