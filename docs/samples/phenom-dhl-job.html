cm 0cm 8.25pt 6pt;\"&gt;&lt;strong&gt;Náplň práce, právomoci a zodpovednosti&lt;/strong&gt;&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Práca v sklade so zásielkami&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Triedenie, skenovanie a príprava zásielok&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Asistencia pri kontrole kvality zásielok&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Riadenie a vykonávanie práce v súlade s pracovnými postupmi - školenia zabezpečíme&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;&lt;br&gt;&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;Pracovný čas: 16:00 - 20:00 od pondelka do piatku, víkendy sú voľne.&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;Mzda: 664 - 734€ eur/btt plus mesačné odmeny do výšky cca 10% z hrubej mesačnej mzdy po skúšobnej dobe – bližšie informácie budú povedané na osobnom pohovore&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;&lt;br&gt;&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;&lt;strong&gt;Osobnostné predpoklady a zručnosti:&lt;/strong&gt;&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Práca s počítačom na úrovni bežného užívateľa&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Samostatnosť, komunikatívnosť&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Zmysel pre tímovú prácu a organizáciu&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Orientácia na kvalitu, pozornosť voči detailom&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;&lt;br&gt;&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;&lt;strong&gt;BENEFITY:&lt;/strong&gt;&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Stravné lístky v hodnote 7,20 eur, plne hradené spoločnosťou&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Bezproblémové parkovanie v areáli spoločnosti&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Ročné odmeny&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Deň voľna v deň narodenín&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Vernostné odmeny&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Odmeny za mimoriadny výkon – Zamestnanec štvrťroka a Zamestnanec roka&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Odmena za inováciu&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Poistenie pre prípad smrti/trvalej invalidity&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Medzinárodné zásielky za zľavnené ceny&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Príspevok na DDS vo výške 2% tarifného platu&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Systém zliav na produkty a služby pre zamestnancov v spolupráci s našimi partnermi&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Spoločenské akcie a teambuildingy&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Prepracovaný systém interného vzdelávania&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Multisport karta - zamestnanci majú možnosť využiť Multisport kartu a dopriať si široké spektrum športových a relaxačných aktivít (úhrada karty je v réžii zamestnanca)&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• Možnosť kariérneho rastu v medzinárodnej spoločnosti&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;&lt;br&gt;&lt;/p&gt;&lt;p style=\"line-height: normal; margin: 0cm 0cm 8.25pt 6pt;\"&gt;• a v neposlednom rade skvelí ľudia okolo! ✈&lt;/p&gt;","title":"Debrief manipulant (part-time) - (Male/Female)","datePosted":"2026-08-25","@context":"http://schema.org","directApply":false,"employmentType":["FULL_TIME"]}</script>   <title key="external-default-job-title">Debrief manipulant (part-time) - (Male/Female) job |  jobs at DHL</title>  <script id="structural-tag" nonce="9a14737d39c7dd5e54ed93c1388c23b4" type="application/ld+json">{"@context": "https://schema.org","@type": "WebPage","inLanguage": "sk_eu","name": "job","url": "https://careers.dhl.com/eu/sk/job/DPDHGLOBALAV366620SKEUEXTERNAL/Debrief-manipulant-part-time-Male-Female","datePublished": "2026-04-14","dateModified": "2026-04-14","nonce": "9a14737d39c7dd5e54ed93c1388c23b4"}</script>
