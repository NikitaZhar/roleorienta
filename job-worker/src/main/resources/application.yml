spring:
  application:
    name: job-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/roleorienta}
    username: ${DB_USERNAME:roleorienta}
    password: ${DB_PASSWORD:roleorienta}
    hikari:
      # Соединений с БД: обработчики обеих очередей (6 + 4), тики и публикатор outbox не ждут друг друга.
      maximum-pool-size: 15
  jpa:
    hibernate:
      ddl-auto: none       # схемой владеет job-api
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:roleorienta}
    password: ${RABBITMQ_PASSWORD:roleorienta}
    # Брокер подтверждает приём каждого сообщения (publisher confirms): outbox отмечает событие
    # отправленным только после подтверждения (технический документ §9).
    publisher-confirm-type: correlated
    # Сообщение, которое не попало ни в одну очередь, брокер возвращает (basic.return), а не
    # теряет молча; вместе с mandatory это защита от потери задания при ошибке маршрута.
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Число обработчиков — у каждой очереди своё (app.task.collect-consumers, discovery-consumers, site-name-consumers).
        # Задание захватывается атомарно (task), вежливость к хостам держит общий бюджет в БД; по
        # одному сообщению на обработчик.
        prefetch: 1
        # Исключение потребителя — сообщение отклоняется без возврата в очередь и уходит в DLQ.
        # Временные отказы повторяет таблица заданий (app.task), а не брокер.
        default-requeue-rejected: false

app:
  outbox:
    batch-size: 100          # максимум событий в одной пачке публикации
    confirm-timeout: 5s      # ожидание подтверждений брокера для пачки
    poll-interval-ms: 1000   # пауза между пачками
    tick-enabled: true       # false — периодическая публикация выключена (тесты)
  task:
    max-attempts: 8          # неудачных попыток до окончательной неудачи (FAILED)
    backoff:
      initial: 5m            # интервал после первой неудачи; далее ×2
      max: 6h                # потолок интервала
      jitter-ratio: 0.1      # случайная надбавка до +10%
    lease: 10m               # незавершённое за этот срок задание снова ставится в очередь
    requeue-batch-size: 100  # максимум заданий за один тик перепостановки
    requeue-interval-ms: 10000
    requeue-enabled: true    # false — перепостановка выключена (тесты)
    collect-consumers: 6     # обработчики очереди сбора: чтение источников, соответствия, проходы (§46)
    discovery-consumers: 4   # обработчики очереди поиска: реестр, сайты, кадровые страницы, обратный путь, портал
    site-name-consumers: 2   # обработчики очереди «адрес по названию» (шаги 3–4 поиска сайта, §51)
  http:
    connect-timeout: 5s      # установление соединения
    read-timeout: 20s        # ожидание ответа и данных
    max-redirects: 5
    max-body-bytes: 5242880  # потолок тела ответа — 5 МБ
    allow-private-addresses: false  # true только для локальных заглушек; в эксплуатации — false
    politeness:
      user-agent: Roleorienta/0.1 (+https://github.com/NikitaZhar/roleorienta)  # единый, с контактом
      host-interval: 1s      # промежуток между запросами к одному хосту по всем репликам
      host-max-wait: 30s     # дольше запрос не ждёт очереди к хосту — временный отказ
      robots-exempt-hosts:   # API, к которым robots.txt не применяется — только решением владельца (§10)
        - query.wikidata.org # SPARQL Wikidata: программный доступ по правилам Wikidata (Data access), §49
  collect:
    read-interval-ms: 3600000  # тик постановки чтений; каждый источник читается раз в сутки
    read-enabled: true         # false — постановка чтений выключена (тесты)
    max-content-requests-per-read: 200  # потолок запросов текста за чтение; Workday ~0,5 с на запрос
    max-checks-per-read: 200   # потолок проверок пропавших из списка с фильтром по стране за чтение
  snapshot:                  # снимки ответов источников (S3; локально MinIO из docker-compose)
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:snapshots}
    access-key: ${S3_ACCESS_KEY:roleorienta}
    secret-key: ${S3_SECRET_KEY:roleorienta-secret}
  intake:                    # общий сбор: партии реестров стран сбора по очереди (Словакия — RPO)
    enabled: true              # false — постановка приёма выключена (тесты)
    interval-ms: 3600000       # тик: страны сбора по условиям пользователей, запуск очереди партий
    batch-size: 1000           # записей реестра на транзакцию
    records-per-task: 200000   # записей за задание (~файл выгрузки); дальше — следующее с того же места
    rpo-endpoint: https://frkqbrydxwdp.compat.objectstorage.eu-frankfurt-1.oraclecloud.com
    rpo-bucket: susr-rpo
    retention: 45d             # срок хранения выгрузок RPO
  site:                      # сайты компаний из Common Crawl (IČO на страницах .sk)
    enabled: true              # false — постановка скана выключена (тесты)
    interval-ms: 3600000       # тик постановки; скан — раз в сутки, новый обход — раз в месяц
    index-url: https://index.commoncrawl.org
    data-url: https://data.commoncrawl.org
    request-interval: 200ms    # пауза перед каждым запросом к Common Crawl
    blocks-per-task: 20        # блоков индекса (~3000 адресов) за задание
    timeout: 60s
  site-check:                # проверка сайта компании: IČO, бренд (технический документ §5.1)
    home-url: https://{host}/  # адрес главной сайта по хосту
  site-name:                 # шаги 3–4 поиска сайта: адреса из названия компании с признаком найма (§5.1)
    enabled: true              # false — постановка выключена (тесты)
    interval-ms: 3600000       # тик постановки; цепочка — раз в сутки
    companies-per-task: 10     # компаний за задание (до 36 адресов на компанию — в аренде 10m)
    recheck-after: 30d         # повторная проверка компании без найденного сайта
    min-employees: 10          # компания без источника вакансий берётся с таким числом сотрудников (RÚZ)
  company-size:              # число сотрудников компаний Словакии из RÚZ Open API (CC0; §5.1, §53)
    enabled: true              # false — постановка выключена (тесты)
    interval-ms: 3600000       # тик постановки; цепочка — раз в сутки
    base-url: https://www.registeruz.sk/cruz-public/api
    companies-per-task: 200    # компаний за задание (2 запроса на компанию, 1 с на хост — в аренде 10m)
    recheck-after: 365d        # повторный запрос: категория меняется с годовой отчётностью
  wikidata:                  # шаг 1 поиска сайта: официальные сайты по IČO (P8174 → P856; технический документ §5.1)
    enabled: true              # false — постановка выключена (тесты)
    interval-ms: 3600000       # тик постановки; шаг — раз в сутки
    endpoint: https://query.wikidata.org/sparql
    page-size: 5000            # строк ответа на запрос
    max-pages: 20              # потолок страниц за задание
    sites-per-task: 100        # компаний, чей сайт проверяется одним заданием (≈ 1 с на запрос — в аренде)
  career:                    # сайты компаний → кадровые страницы → источники
    enabled: true              # false — постановка проверки выключена (тесты)
    interval-ms: 3600000       # тик постановки; проверка — раз в сутки цепочкой заданий
    scheme: https
    sites-per-task: 50         # сайтов за задание
    recheck-after: 30d         # перепроверка сайта и доски (технический документ §17)
    boards-per-task: 20        # обратный путь: блоков индекса или досок за задание
    check-time-budget: 4m      # проверка досок за задание не дольше — задание укладывается в аренду (10m)
  state-portal:              # государственный портал вакансий Služby zamestnanosti (технический документ §5, §5.1)
    enabled: true              # false — постановка выключена (тесты)
    interval-ms: 3600000       # тик: список работодателей — раз в неделю, проверка — раз в день
    base-url: https://www.sluzbyzamestnanosti.gov.sk
    offers-page-size: 50       # вакансий работодателя на страницу
    max-offer-pages: 20        # потолок страниц вакансий работодателя за чтение; упор — неполное чтение
    checks-per-task: 150       # работодателей за задание проверки (≈ 1 с на запрос — в аренде 10m)
    recheck-after: 7d          # повторная проверка работодателя без источника
  match:                     # предрасчёт соответствия вакансий позициям (словарь positions.json)
    enabled: true              # false — постановка выключена (тесты)
    interval-ms: 3600000       # тик постановки
  delivery:                  # выдача порциями (технический документ §7)
    enabled: true              # false — планирование проходов выключено (тесты)
    interval-ms: 3600000       # тик планирования; проход — раз в час, окно — начало часа
    hide-after: 30d            # срок без подтверждения: дольше не подтверждённая вакансия не выдаётся
  geo:                       # справочник городов GeoNames (CC BY 4.0)
    enabled: true              # false — загрузка не ставится (тесты)
    interval-ms: 3600000       # тик: справочник пуст — загрузить
    url: https://download.geonames.org/export/dump/cities15000.zip
  crawl:
    unavailable-after: 7d      # серия временных отказов источника до статуса «недоступен»
  vacancy:
    close-after-missing-reads: 3  # полных чтений подряд без публикации до её закрытия
  adapter:
    greenhouse:
      base-url: https://boards-api.greenhouse.io
    personio:
      base-url-template: https://{board}  # {board} — хост витрины: <компания>.jobs.personio.de | .com
    workday:
      base-url-template: https://{host}  # {host} — <тенант>.<dc>.myworkdayjobs.com
      page-size: 20        # Workday отдаёт не больше 20 на страницу
      max-pages: 100       # потолок страниц за чтение; упор — неполное чтение
    smartrecruiters:        # кадровые страницы и страницы вакансий (API запрещён robots.txt)
      careers-url: https://careers.smartrecruiters.com
      jobs-url: https://jobs.smartrecruiters.com
      max-pages: 300       # потолок страниц списка за чтение (у JYSK объявлено 167); 300 с паузой 1 с и текст 200 вакансий — в аренде 10m
    phenom:                 # кадровые сайты работодателей на Phenom (§59)
      site-url: https://{board}  # {board} — доска (хост и путь языка сайта)
      max-pages: 40        # потолок страниц списка за чтение (по 10 вакансий страны сбора)
    nalgoo:                 # публичный API кадровых сайтов Nalgoo (§58)
      api-url: https://ats.nalgoo.com/api/v3
    successfactors:         # кадровые сайты работодателей на SAP SuccessFactors Career Site Builder (§57)
      site-url: https://{host}  # {host} — доска (хост кадрового сайта)
      max-pages: 40        # потолок страниц списка за чтение (по 20–25 вакансий страны сбора)
    jobposting:
      max-pages: 200       # потолок страниц вакансий сайта за чтение; упор — неполное чтение

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
