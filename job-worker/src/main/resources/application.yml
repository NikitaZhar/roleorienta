spring:
  application:
    name: job-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/roleorienta}
    username: ${DB_USERNAME:roleorienta}
    password: ${DB_PASSWORD:roleorienta}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  # Схемой владеет job-api; worker не применяет миграции (ADR-2).
  flyway:
    enabled: false
  # Брокер фоновых заданий (ADR-1). Соединение ленивое: контекст стартует и при
  # недоступном брокере, а обработка/публикация возобновляются по восстановлении.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:roleorienta}
    password: ${RABBITMQ_PASSWORD:roleorienta}
    publisher-confirm-type: correlated
    publisher-returns: true
    # mandatory: немаршрутизируемое сообщение брокер возвращает (basic.return), а не
    # теряет молча — нужно для корректного outbox (A15).
    template:
      mandatory: true
    # Нативные повторы потребителя (Spring Boot 4, без spring-retry). При
    # исчерпании попыток сообщение отклоняется без повторной постановки в очередь
    # (default-requeue-rejected=false) и уходит в DLX→DLQ.
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Liveness не зависит от внешних систем (§11). Readiness отражает БД;
      # брокер не делает worker неготовым — недоступность обрабатывается явно.
      group:
        readiness:
          include: readinessState,db

# Настройки магистрали доставки (значения по умолчанию совпадают с кодом; вынесены
# сюда для внешней конфигурации — §3.4 боевого контракта).
app:
  collect:
    http:
      # HTTP-клиент сбора (SourceHttpProperties, §71): тайм-ауты, редиректы (каждый
      # ре-валидируется SSRF-контуром) и потолок размера тела ответа — больше отклоняется.
      connect-timeout-ms: 5000
      read-timeout-ms: 15000
      max-redirects: 5
      max-body-bytes: 5242880
    # Потолок страниц ленты источника за один обход DISCOVER_PAGE (§62; Workday — 20 на
    # страницу). Лента читается только в области целевого рынка (app.discovery.market).
    max-list-pages: 10
    niche:
      # Ниша пилота (§63): деталь (отдельный запрос на вакансию) — только для заголовков с
      # этими словами (целым словом, без учёта регистра); exclude сильнее include. Списки
      # временные — в продукте ниша задаётся иначе, механизм отбора тот же.
      include: "Java,Kotlin,Scala,JVM,Spring,Backend,Back-end,Software Engineer,Software Developer,Platform,DevOps,SRE,Site Reliability,Cloud,Microservices,Architect"
      exclude: "SAP,Sales,Marketing,Clinical,Intern,Internship,Accountant,Accounting,Technician"
      # Максимум запросов детали на источник за сутки (UTC); новые вакансии — первыми.
      daily-detail-budget: 30
  outbox:
    # Публикатор outbox включён по умолчанию; в тестах отключается (пачки
    # запускаются вручную).
    scheduler:
      enabled: true
    # Период тика публикатора, мс.
    poll-interval-ms: 1000
    # Максимум событий в одной пачке (транзакция удерживается на время
    # подтверждений, поэтому пачка ограничена).
    batch-size: 100
    # Тайм-аут ожидания подтверждений брокера на пачку, мс.
    confirm-timeout-ms: 5000
  scheduler:
    # Планировщик источников включён по умолчанию; в тестах отключается (проход
    # запускается вручную).
    enabled: true
    # Период тика планировщика, мс.
    poll-interval-ms: 60000
    # Размер окна расписания, мс (по умолчанию 15 минут): в пределах одного окна
    # источник планируется один раз.
    window-ms: 900000
  source:
    pacing:
      # Вежливость к источникам (§57, B1-минимум): не чаще одного запроса за интервал на
      # домен (все тенанты *.myworkdayjobs.com — один домен: общая инфраструктура Workday).
      # Темп — на процесс воркера; при N репликах суммарная частота ×N.
      default-interval-ms: 1000
      intervals-ms:
        "[myworkdayjobs.com]": 2000
        "[commoncrawl.org]": 3000
        # Площадка сравнения покрытия (A5, §82): один запрос на работодателя, не чаще раза в 10 с.
        "[karriere.at]": 10000
      # Дольше этого поток слота не ждёт — задание откладывается (SourceBackoffException).
      max-wait-ms: 20000
      # Потолок паузы по Retry-After и пауза при 429 без заголовка.
      max-backoff-ms: 3600000
      default-retry-after-ms: 60000
  discovery:
    harvest:
      # Гарвест-вход обнаружения (§36): периодически подаёт кандидатов из seed.
      # В тестах отключается (проход запускается напрямую).
      enabled: true
      # Период тика гарвеста, мс.
      poll-interval-ms: 120000
      # Бюджет fan-out (A29): максимум заданий DISCOVER_EMPLOYER за один проход.
      max-fan-out: 20
      # Курируемый список кандидатов (provider/slug/baseUrl). На пилоте заполняется
      # вручную; публичные датасеты (Common Crawl / CT, A11) — следующий срез.
      seed: []
    market:
      # Целевой рынок пилота для гейта обнаружения (§56): английские названия стран, как
      # их отдаёт провайдер (Workday — фасет Location_Country). Нет публикаций на рынке →
      # кандидат OUT_OF_MARKET. Пустой список — гейт рынка выключен.
      countries: "Slovakia,Slovak Republic,Austria"
      # Однозначные признаки локации на рынке — когда фасета стран нет (у Workday: тенант с
      # одной страной, §59/§61): страны, коды, земли, города без «тёзок» за рубежом.
      location-terms: "Slovakia,Slovak Republic,Slovensko,Bratislava,Kosice,Košice,Zilina,Žilina,Austria,Österreich,Wien,Graz,Linz,Salzburg,Innsbruck,Styria,Steiermark,Upper Austria,Oberösterreich,Tyrol,Tirol,Carinthia,Kärnten,SVK,AUT"
      # Неоднозначные города (есть «тёзки» в США: Vienna, VA/WV/GA): с маркером США —
      # не рынок; без страны — кандидат на ручную проверку, не авто-подключение (§61).
      ambiguous-location-terms: "Vienna"
    name-backfill:
      # Имена компаний, заведённых до §80 с именем-slug (§83): раз в период до 10 компаний
      # получают имя из описания доски (иначе — владелец из slug). В тестах выключено.
      enabled: true
      poll-interval-ms: 3600000
    ownership:
      # Проверка принадлежности доски перед авто-подключением (A2, §79): признаки кадрового
      # агентства в описании страницы доски (подстрока без учёта регистра). Найден признак —
      # кандидат на ручную проверку: агентство публикует вакансии чужих работодателей.
      agency-markers: "staffing,recruitment agency,recruiting agency,employment agency,personalvermittlung,personaldienstleist,zeitarbeit,arbeitskräfteüberlassung,on behalf of our client"
    cc:
      # Индекс Common Crawl (CDX Server API) — основной вход обнаружения Workday (§54, §55).
      index-base-url: https://index.commoncrawl.org
      # Живой обход включён (A1, §72): условия B1 (темп/Retry-After, §57) и B2 (потолок тела
      # ответа, §71) выполнены. Бюджет — ниже (pages-per-pass, max-fan-out). В тестах выключен.
      enabled: true
      # Период тика, мс.
      poll-interval-ms: 600000
      # Шаблон URL индекса.
      url-pattern: "*.myworkdayjobs.com"
      # Размер страницы CDX в блоках (~3000 URL на блок). Страница по умолчанию сервера (5
      # блоков, ~12 с) упирается в тайм-аут шлюза индекса (504 через ~10 с) — берём мельче.
      # Смена значения перезапускает обход коллекции с начала (дедуп гасит повторы).
      page-size: 1
      # Бюджеты прохода (A29): страниц CDX за проход и заданий DISCOVER_EMPLOYER
      # (каждое — запрос к ленте тенанта).
      pages-per-pass: 1
      max-fan-out: 20
      # Аренда прохода, с (сеть идёт вне транзакции; аренда не даёт двум репликам обходить сразу).
      lease-seconds: 900
  coverage:
    # Проверка покрытия площадкой karriere.at (A5, §82): австрийские публикации сравниваются с
    # выдачей площадки по работодателю. В тестах выключена (проход запускается напрямую).
    enabled: true
    # Период тика, мс.
    poll-interval-ms: 1800000
    # Работодателей за проход (по одному запросу к площадке).
    max-companies-per-pass: 3
    # Оценка старше — проверяется снова, ч.
    recheck-after-hours: 24
    search-url: https://www.karriere.at/jobs/
  digest:
    match:
      # Сопоставление изменений с подписками (§39): периодически формирует уведомления.
      # В тестах отключается (проход запускается напрямую).
      enabled: true
      # Период тика сопоставления, мс.
      poll-interval-ms: 60000
      # Размер пачки необработанных изменений за проход.
      batch-size: 200
