spring:
  application:
    name: job-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/roleorienta}
    username: ${DB_USERNAME:roleorienta}
    password: ${DB_PASSWORD:roleorienta}
  jpa:
    hibernate:
      ddl-auto: none       # схемой владеет job-api
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:roleorienta}
    password: ${RABBITMQ_PASSWORD:roleorienta}
    # Брокер подтверждает приём каждого сообщения (publisher confirms): outbox отмечает событие
    # отправленным только после подтверждения (технический документ §9).
    publisher-confirm-type: correlated
    # Сообщение, которое не попало ни в одну очередь, брокер возвращает (basic.return), а не
    # теряет молча; вместе с mandatory это защита от потери задания при ошибке маршрута.
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Исключение потребителя — сообщение отклоняется без возврата в очередь и уходит в DLQ.
        # Временные отказы повторяет таблица заданий (app.task), а не брокер.
        default-requeue-rejected: false

app:
  outbox:
    batch-size: 100          # максимум событий в одной пачке публикации
    confirm-timeout: 5s      # ожидание подтверждений брокера для пачки
    poll-interval-ms: 1000   # пауза между пачками
    tick-enabled: true       # false — периодическая публикация выключена (тесты)
  task:
    max-attempts: 8          # неудачных попыток до окончательной неудачи (FAILED)
    backoff:
      initial: 5m            # интервал после первой неудачи; далее ×2
      max: 6h                # потолок интервала
      jitter-ratio: 0.1      # случайная надбавка до +10%
    lease: 10m               # незавершённое за этот срок задание снова ставится в очередь
    requeue-batch-size: 100  # максимум заданий за один тик перепостановки
    requeue-interval-ms: 10000
    requeue-enabled: true    # false — перепостановка выключена (тесты)
  http:
    connect-timeout: 5s      # установление соединения
    read-timeout: 20s        # ожидание ответа и данных
    max-redirects: 5
    max-body-bytes: 5242880  # потолок тела ответа — 5 МБ
    allow-private-addresses: false  # true только для локальных заглушек; в эксплуатации — false
    politeness:
      user-agent: Roleorienta/0.1 (+https://github.com/NikitaZhar/roleorienta)  # единый, с контактом
      host-interval: 1s      # промежуток между запросами к одному хосту по всем репликам
      host-max-wait: 30s     # дольше запрос не ждёт очереди к хосту — временный отказ
  collect:
    read-interval-ms: 3600000  # тик постановки чтений; каждый источник читается раз в сутки
    read-enabled: true         # false — постановка чтений выключена (тесты)
    max-content-requests-per-read: 200  # потолок запросов текста за чтение; Workday ~0,5 с на запрос
  snapshot:                  # снимки ответов источников (S3; локально MinIO из docker-compose)
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:snapshots}
    access-key: ${S3_ACCESS_KEY:roleorienta}
    secret-key: ${S3_SECRET_KEY:roleorienta-secret}
  vacancy:
    close-after-missing-reads: 3  # полных чтений подряд без публикации до её закрытия
  adapter:
    greenhouse:
      base-url: https://boards-api.greenhouse.io
    personio:
      base-url-template: https://{board}  # {board} — хост витрины: <компания>.jobs.personio.de | .com
    workday:
      base-url-template: https://{host}  # {host} — <тенант>.<dc>.myworkdayjobs.com
      page-size: 20        # Workday отдаёт не больше 20 на страницу
      max-pages: 100       # потолок страниц за чтение; упор — неполное чтение
    jobposting:
      max-pages: 200       # потолок страниц вакансий сайта за чтение; упор — неполное чтение

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
