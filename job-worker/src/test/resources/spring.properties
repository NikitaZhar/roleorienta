# Свойства Spring Framework для тестов job-worker (механизм SpringProperties: файл spring.properties в корне classpath).
#
# Пауза тестовых контекстов выключена (стенограмма §155). По умолчанию Spring 7 останавливает кэшированный контекст,
# когда следующий тест-класс берёт другой, и перезапускает его при возврате. Перезапуск вызывает
# RabbitListenerEndpointRegistry.start(), а он после refresh контекста запускает все слушатели очередей, даже с
# auto-startup: false (application-test.yml): TaskListener забирал сообщения, которые тест читал сам
# (OutboxPublisherTests — «Expecting actual not to be null» через 5 с).
# https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/ctx-management/context-pausing.html
spring.test.context.cache.pause=never
