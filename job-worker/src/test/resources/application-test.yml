# Профиль интеграционных тестов job-worker.
spring:
  flyway:
    # Схему в тестах создают те же миграции, что применяет job-api (единственный источник схемы).
    # Путь от каталога модуля job-worker, из которого Maven запускает тесты.
    enabled: true
    locations: filesystem:../job-api/src/main/resources/db/migration
  rabbitmq:
    listener:
      simple:
        auto-startup: false  # потребитель запускается только в тестах, где нужен (TaskFlowTests)

app:
  http:
    politeness:
      host-interval: 0s      # заглушки на одном хосте; бюджет проверяет PostgresHostBudgetTests
  outbox:
    tick-enabled: false      # пачки публикуются из теста вручную — результат детерминирован
  task:
    requeue-enabled: false   # перепостановка вызывается из теста вручную
  collect:
    read-enabled: false      # чтение источников ставится из теста вручную
  intake:
    enabled: false           # приём реестра ставится из теста вручную
  site:
    enabled: false           # скан сайтов ставится из теста вручную
  career:
    enabled: false           # проверка сайтов ставится из теста вручную
  match:
    enabled: false           # предрасчёт соответствий ставится из теста вручную
  delivery:
    enabled: false           # проходы планируются из теста вручную
  geo:
    enabled: false           # справочник GeoNames в тестах не загружается
  state-portal:
    enabled: false           # работа с государственным порталом ставится из теста вручную
  wikidata:
    enabled: false           # шаг «Wikidata» ставится из теста вручную
  site-name:
    enabled: false           # шаг «адрес по названию» ставится из теста вручную
  company-size:
    enabled: false           # шаг «число сотрудников из RÚZ» ставится из теста вручную
