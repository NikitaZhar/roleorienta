# Профиль интеграционных тестов магистрали доставки.
# Публикатор-тик отключён: пачки outbox запускаются из теста вручную,
# чтобы результат был детерминированным.
app.outbox.scheduler.enabled=false
app.outbox.poll-interval-ms=3600000
# Планировщик источников тоже запускается из теста вручную.
app.scheduler.enabled=false
app.scheduler.poll-interval-ms=3600000
app.scheduler.window-ms=900000
app.outbox.batch-size=100
app.outbox.confirm-timeout-ms=5000
# Быстрые повторы, чтобы путь «повторы -> DLQ» проходил за доли секунды.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=2
spring.rabbitmq.listener.simple.retry.initial-interval=20ms
spring.rabbitmq.listener.simple.retry.multiplier=1.0
# Гарвест обнаружения тоже запускается из теста напрямую.
app.discovery.harvest.enabled=false
# Сопоставление подписок тоже запускается из теста напрямую.
app.digest.match.enabled=false
